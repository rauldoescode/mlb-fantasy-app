spring.application.name=league-engine
server.port=8080

# JDBC-formatted URL for the Java engine (separate from the Python DATABASE_URL).
# Form: jdbc:postgresql://host:port/db?user=...&password=...
spring.config.import=file:../.env[.properties]
spring.datasource.url=${JDBC_DATABASE_URL}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-256-bits-long-secret}
app.jwt.expiration-ms=86400000

# Season scheduling. Week 1 starts on this Monday; weeks run Monday 00:00 -> Sunday 23:59
# in the league time zone. Adjust to MLB 2026 opening week.
app.season.start-monday=2026-03-23
app.season.zone=America/New_York

# CORS origin for the Next.js PWA (comma-separated allowed).
app.cors.allowed-origins=http://localhost:3000

